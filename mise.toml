# Project-local release toolchain and human-operated release tasks.
[tools]
deno = "2.9.1"
goreleaser = "2"

[tasks."release:prepare"]
description = "Bump deno.json, test, and dry-run the binary release pipeline"
run = "deno run --allow-read --allow-write --allow-run --allow-env scripts/release.ts prepare"

[tasks."release:publish"]
description = "Push the tagged commit and create the GitHub Release (human-only)"
run = "deno run --allow-read --allow-run --allow-env scripts/release.ts publish"
